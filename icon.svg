<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 物探しカメラ：カメラの枠の中で、登録した品物（鍵）が見つかった絵 -->
  <defs>
    <radialGradient id="glow" cx="0.46" cy="0.54" r="0.42">
      <stop offset="0" stop-color="#3fb8b0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3fb8b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1f2a37"/>
  <circle cx="236" cy="276" r="200" fill="url(#glow)"/>
  <!-- カメラの枠（四すみ） -->
  <path d="M84 176V116q0-32 32-32h60M336 84h60q32 0 32 32v60M428 336v60q0 32-32 32h-60M176 428h-60q-32 0-32-32v-60"
        fill="none" stroke="#e8e6e1" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 鍵 -->
  <g transform="rotate(40 236 276)" fill="#f2b134">
    <path fill-rule="evenodd" d="M136 214a62 62 0 1 1 0 124a62 62 0 1 1 0-124zm0 38a24 24 0 1 0 0 48a24 24 0 1 0 0-48z"/>
    <rect x="186" y="256" width="182" height="40" rx="12"/>
    <rect x="296" y="286" width="26" height="38" rx="6"/>
    <rect x="336" y="286" width="26" height="54" rx="6"/>
  </g>
  <!-- 見つかった印 -->
  <circle cx="356" cy="160" r="58" fill="#3fb8b0" stroke="#1f2a37" stroke-width="16"/>
  <path d="M330 161l18 18l34-36" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
